<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 400px;
        margin: 10px auto;
        padding: 20px;
        background-color: #d9a6a6;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
        text-align: center;
        color: #333;
    }

    form {
        display: flex;
        flex-direction: column;
    }

    label {
        margin-bottom: 5px;
        color: #555;
    }

    input[type="text"] {
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    button {
        padding: 10px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover {
        background-color: #218838;
    }

    .result {
        margin-top: 20px;
    }

    .result h3 {
        color: #333;
    }
</style>
<body>
    <div class="container">
        <h1> BMI Calculator </h1>
        <form>
            <p><label >Height in cm: </label><input type="text" id="height" placeholder="Enter your height"></p>
            <p><label >Weight in kg: </label><input type="text" id="weight" placeholder="Enter your weight"></p>
            <button>calculate</button>
            <div class="result" id="result">
                <h3>BMI weight guide</h3>
                <p>Below 18.5 = Underweight</p>
                <p>18.5 - 24.9 = Normal weight</p>  
                <p>25 - 29.9 = Overweight</p>
                <p>30 and Above = Obesity</p>
            </div>
        </form>
    </div>
    <script src="p2.js"></script>
</body>
</html>
