<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 24px;
            background-color: brown;
            //background: linear-gradient(135deg, #eef5ff, #f8fbff);
            color: #172554;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin: 0 0 32px;
            text-align: center;
            font-size: clamp(2rem, 5vw, 3rem);
        }

        ul {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0;
            list-style: none;
        }

        li {
            overflow: hidden;
            padding: 10px;
            border: 1px solid #dbeafe;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 12px 30px rgb(23 37 84 / 10%);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        li:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 36px rgb(23 37 84 / 18%);
        }

        img {
            display: block;
            width: 260px;
            max-width: 100%;
            height: 190px;
            border-radius: 12px;
            object-fit: cover;
        }

        @media (max-width: 480px) {
            body {
                padding: 32px 16px;
            }

            li,
            img {
                width: 100%;
            }

            img {
                height: 220px;
            }
        }
    </style>
</head>

 <script>
    // here we use events
    const images = document.getElementById('images');

    //  attachEvent()
    // jQuery - on

    // type, timestamp, defaultPrevented
    // target, toElement, srcElement, currentTarget,
    // clientX, clientY, screenX, screenY
    // altkey, ctrlkey, shiftkey, keyCode

    images.addEventListener('click', function (event) {     //Jab browser mein koi event hota hai — jaise click, keydown, submit, mouseover — browser us event ki information ka ek Event object banata hai.
         console.log("clicked inside the ul");                                                    //Phir browser tumhare callback function ko woh object automatically de deta hai.
        
        if (!(event.target instanceof HTMLImageElement)) {
            return;
        }  // ka matlab: kya clicked element ek <img> element hai?


        console.log(event.target.tagName); //tagName clicked element ka HTML tag batata hai.
        console.log(event.target.id);

        if (event.target.id === 'owl') {
            alert("owl clicked");
        }

        event.target.closest('li').remove();
    });
